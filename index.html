<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan KAS RW 11 YKB</title>
  <link rel="manifest" href='data:application/json,{"name":"Kas RW 11 YKB","short_name":"Kas RW11","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#0f5132"}'>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Pustaka Ekspor Excel & PDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

  <!-- Header Utama -->
  <header class="bg-[#005c53] text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logo Komplek YKB -->
        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white bg-white flex-shrink-0">
          <img src="logo.png">
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Laporan KAS RW 11 YKB</h1>
          <p class="text-xs text-gray-200">Transparansi keuangan warga</p>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Filter & Tombol Aksi -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Periode</label>
        <select id="filterBulan" onchange="render()" class="bg-white border border-gray-300 text-sm rounded-lg p-2 focus:ring-teal-500 focus:border-teal-500">
          <option value="semua">Semua bulan</option>
        </select>
      </div>
      <div class="flex gap-2">
        <button onclick="downloadExcel()" class="bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg hover:bg-emerald-800 font-semibold shadow-sm flex items-center gap-1">
          📊 Download Excel
        </button>
        <button onclick="downloadPDF()" class="bg-red-700 text-white text-xs px-3 py-2 rounded-lg hover:bg-red-800 font-semibold shadow-sm flex items-center gap-1">
          📄 Download PDF
        </button>
        <button id="btnAdmin" onclick="toggleAdminMode()" class="bg-amber-100 text-amber-800 text-xs px-3 py-2 rounded-lg border border-amber-300 hover:bg-amber-200 font-semibold shadow-sm">
          🔒 Mode Admin
        </button>
      </div>
    </div>

    <!-- Ringkasan Saldo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Pemasukan</p>
        <p id="totalPemasukan" class="text-xl font-bold text-emerald-600">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Pengeluaran</p>
        <p id="totalPengeluaran" class="text-xl font-bold text-red-600">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Saldo Kas</p>
        <p id="saldoKas" class="text-xl font-bold text-gray-800">Rp 0</p>
      </div>
    </div>

    <!-- Form Input Admin -->
    <div id="formAdmin" class="hidden bg-amber-50 p-4 rounded-xl shadow-sm border border-amber-200 mb-6">
      <h3 class="font-bold text-amber-900 mb-3 text-sm">➕ Tambah Transaksi Baru (Khusus Admin)</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        <input type="date" id="inputTanggal" class="p-2 text-sm border rounded">
        <input type="text" id="inputKeterangan" placeholder="Keterangan" class="p-2 text-sm border rounded">
        <input type="number" id="inputPemasukan" placeholder="Pemasukan (Rp)" class="p-2 text-sm border rounded">
        <input type="number" id="inputPengeluaran" placeholder="Pengeluaran (Rp)" class="p-2 text-sm border rounded">
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button onclick="simpanData()" class="bg-teal-700 text-white px-4 py-2 text-sm rounded font-semibold hover:bg-teal-800">Simpan ke Google Sheet</button>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto mb-6">
      <table id="tabelLaporan" class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-600 border-b">
          <tr>
            <th class="p-3">Tanggal</th>
            <th class="p-3">Keterangan</th>
            <th class="p-3 text-right">Pemasukan</th>
            <th class="p-3 text-right">Pengeluaran</th>
            <th class="p-3 text-right">Saldo</th>
            <th id="thAksi" class="p-3 text-center hidden">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelBody" class="divide-y">
          <tr><td colspan="5" class="p-4 text-center text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Grafik Per Bulan -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h3 class="font-bold text-gray-700 mb-4 text-sm">Grafik per bulan</h3>
      <div class="h-64">
        <canvas id="kasChart"></canvas>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Data diperbarui secara otomatis dari sistem RW 11 YKB.</p>

  </div>

  <script>
    // URL Google Apps Script milik Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbyoB0BXj0bIAbtU5aIPp2fHxizLYbYeLuoC5qLi8O9kkzHzpli5JmfXuk9-_XzO0rz8Cg/exec";
    
    let rawData = [];
    let currentFilteredData = [];
    let isAdmin = false;
    let adminPin = "";
    let myChart = null;

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        rawData = await res.json();
        setupFilterOptions();
        render();
      } catch (e) {
        alert("Gagal memuat data dari Google Sheets.");
      }
    }

    function setupFilterOptions() {
      const filterSelect = document.getElementById("filterBulan");
      const currentSelected = filterSelect.value || "semua";
      filterSelect.innerHTML = '<option value="semua">Semua bulan</option>';
      
      const bulanSet = new Set();
      rawData.forEach(item => {
        if (item.tanggal) {
          const m = item.tanggal.substring(0, 7); // YYYY-MM
          bulanSet.add(m);
        }
      });

      Array.from(bulanSet).sort().reverse().forEach(b => {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        filterSelect.appendChild(opt);
      });

      filterSelect.value = currentSelected;
    }

    function render() {
      const selectedBulan = document.getElementById("filterBulan").value;
      currentFilteredData = rawData.filter(d => {
        if (selectedBulan === "semua") return true;
        return d.tanggal && d.tanggal.startsWith(selectedBulan);
      });

      let totalIn = 0, totalOut = 0, runningSaldo = 0;
      const tbody = document.getElementById("tabelBody");
      tbody.innerHTML = "";

      currentFilteredData.forEach(item => {
        totalIn += item.pemasukan;
        totalOut += item.pengeluaran;
        runningSaldo += (item.pemasukan - item.pengeluaran);
        item.currentSaldo = runningSaldo;

        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-3 text-xs text-gray-600">${formatTanggal(item.tanggal)}</td>
          <td class="p-3 font-medium">${item.keterangan}</td>
          <td class="p-3 text-right text-emerald-600 font-semibold">${item.pemasukan ? 'Rp ' + item.pemasukan.toLocaleString('id-ID') : ''}</td>
          <td class="p-3 text-right text-red-600 font-semibold">${item.pengeluaran ? 'Rp ' + item.pengeluaran.toLocaleString('id-ID') : ''}</td>
          <td class="p-3 text-right font-bold text-gray-700">Rp ${runningSaldo.toLocaleString('id-ID')}</td>
          ${isAdmin ? `<td class="p-3 text-center"><button onclick="hapusData(${item.id})" class="text-red-500 hover:text-red-700 text-xs font-bold">Hapus</button></td>` : ''}
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalPemasukan").innerText = "Rp " + totalIn.toLocaleString('id-ID');
      document.getElementById("totalPengeluaran").innerText = "Rp " + totalOut.toLocaleString('id-ID');
      document.getElementById("saldoKas").innerText = "Rp " + runningSaldo.toLocaleString('id-ID');

      renderChart();
    }

    function formatTanggal(tglStr) {
      if (!tglStr) return "";
      const d = new Date(tglStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function toggleAdminMode() {
      if (!isAdmin) {
        const inputPin = prompt("Masukkan PIN Admin:");
        if (inputPin) {
          adminPin = inputPin;
          isAdmin = true;
          document.getElementById("formAdmin").classList.remove("hidden");
          document.getElementById("thAksi").classList.remove("hidden");
          document.getElementById("btnAdmin").innerText = "🔓 Keluar Admin";
          render();
        }
      } else {
        isAdmin = false;
        adminPin = "";
        document.getElementById("formAdmin").classList.add("hidden");
        document.getElementById("thAksi").classList.add("hidden");
        document.getElementById("btnAdmin").innerText = "🔒 Mode Admin";
        render();
      }
    }

    async function simpanData() {
      const tanggal = document.getElementById("inputTanggal").value;
      const keterangan = document.getElementById("inputKeterangan").value;
      const pemasukan = Number(document.getElementById("inputPemasukan").value) || 0;
      const pengeluaran = Number(document.getElementById("inputPengeluaran").value) || 0;

      if (!tanggal || !keterangan) {
        alert("Tanggal dan Keterangan wajib diisi!");
        return;
      }

      const payload = { action: "add", pin: adminPin, tanggal, keterangan, pemasukan, pengeluaran };
      
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      
      if (result.status === "success") {
        alert("Data berhasil disimpan!");
        document.getElementById("inputKeterangan").value = "";
        document.getElementById("inputPemasukan").value = "";
        document.getElementById("inputPengeluaran").value = "";
        loadData();
      } else {
        alert(result.message);
      }
    }

    async function hapusData(id) {
      if (!confirm("Yakin ingin menghapus baris ini?")) return;
      const payload = { action: "delete", pin: adminPin, id };
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === "success") {
        loadData();
      } else {
        alert(result.message);
      }
    }

    function renderChart() {
      const monthlyData = {};
      rawData.forEach(d => {
        if (d.tanggal) {
          const m = d.tanggal.substring(0, 7);
          if (!monthlyData[m]) monthlyData[m] = { in: 0, out: 0 };
          monthlyData[m].in += d.pemasukan;
          monthlyData[m].out += d.pengeluaran;
        }
      });

      const labels = Object.keys(monthlyData).sort();
      const dataIn = labels.map(l => monthlyData[l].in);
      const dataOut = labels.map(l => monthlyData[l].out);

      const ctx = document.getElementById('kasChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Pemasukan', data: dataIn, backgroundColor: '#10b981' },
            { label: 'Pengeluaran', data: dataOut, backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // --- FUNGSI DOWNLOAD EXCEL ---
    function downloadExcel() {
      const selectedBulan = document.getElementById("filterBulan").value;
      const exportData = currentFilteredData.map(item => ({
        "Tanggal": formatTanggal(item.tanggal),
        "Keterangan": item.keterangan,
        "Pemasukan (Rp)": item.pemasukan || 0,
        "Pengeluaran (Rp)": item.pengeluaran || 0,
        "Saldo (Rp)": item.currentSaldo || 0
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Kas");

      const fileName = `Laporan_Kas_RW11_YKB_${selectedBulan}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }

    // --- FUNGSI DOWNLOAD PDF ---
    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const selectedBulan = document.getElementById("filterBulan").value;

      doc.setFontSize(14);
      doc.text("Laporan KAS RW 11 YKB", 14, 15);
      doc.setFontSize(10);
      doc.text(`Periode: ${selectedBulan === "semua" ? "Semua Bulan" : selectedBulan}`, 14, 22);

      const tableRows = currentFilteredData.map(item => [
        formatTanggal(item.tanggal),
        item.keterangan,
        item.pemasukan ? 'Rp ' + item.pemasukan.toLocaleString('id-ID') : '-',
        item.pengeluaran ? 'Rp ' + item.pengeluaran.toLocaleString('id-ID') : '-',
        'Rp ' + (item.currentSaldo || 0).toLocaleString('id-ID')
      ]);

      doc.autoTable({
        startY: 28,
        head: [['Tanggal', 'Keterangan', 'Pemasukan', 'Pengeluaran', 'Saldo']],
        body: tableRows,
        theme: 'grid',
        headStyles: { fillColor: [0, 92, 83] },
        styles: { fontSize: 8 }
      });

      const fileName = `Laporan_Kas_RW11_YKB_${selectedBulan}.pdf`;
      doc.save(fileName);
    }

    // Jalankan pertama kali
    loadData();
  </script>
</body>
</html>
