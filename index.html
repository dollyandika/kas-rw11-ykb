<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan KAS RW 11 YKB</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Pustaka Ekspor Excel & PDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

  <!-- Header Utama -->
  <header class="bg-[#005c53] text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logo Komplek YKB -->
        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white bg-white flex-shrink-0">
          <img id="logoImg" src="logo.png" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Laporan KAS RW 11 YKB</h1>
          <p class="text-xs text-gray-200">Transparansi keuangan warga</p>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Filter & Tombol Aksi -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Periode</label>
        <select id="filterBulan" onchange="render()" class="bg-white border border-gray-300 text-sm rounded-lg p-2 focus:ring-teal-500 focus:border-teal-500">
          <option value="semua">Semua bulan</option>
        </select>
      </div>
      <div class="flex gap-2">
        <button onclick="downloadExcel()" class="bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg hover:bg-emerald-800 font-semibold shadow-sm flex items-center gap-1">
          📊 Download Excel
        </button>
        <button onclick="downloadPDF()" class="bg-red-700 text-white text-xs px-3 py-2 rounded-lg hover:bg-red-800 font-semibold shadow-sm flex items-center gap-1">
          📄 Download PDF
        </button>
        <button id="btnAdmin" onclick="toggleAdminMode()" class="bg-amber-100 text-amber-800 text-xs px-3 py-2 rounded-lg border border-amber-300 hover:bg-amber-200 font-semibold shadow-sm">
          🔒 Mode Admin
        </button>
      </div>
    </div>

    <!-- Ringkasan Saldo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Pemasukan</p>
        <p id="totalPemasukan" class="text-xl font-bold text-emerald-600">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Pengeluaran</p>
        <p id="totalPengeluaran" class="text-xl font-bold text-red-600">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs font-semibold text-gray-500">Saldo Kas</p>
        <p id="saldoKas" class="text-xl font-bold text-gray-800">Rp 0</p>
      </div>
    </div>

    <!-- Form Input / Edit Admin -->
    <div id="formAdmin" class="hidden bg-amber-50 p-4 rounded-xl shadow-sm border border-amber-200 mb-6">
      <h3 id="formTitle" class="font-bold text-amber-900 mb-3 text-sm">➕ Tambah Transaksi Baru (Khusus Admin)</h3>
      <input type="hidden" id="editId" value="">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        <input type="date" id="inputTanggal" class="p-2 text-sm border rounded bg-white">
        <input type="text" id="inputKeterangan" placeholder="Keterangan" class="p-2 text-sm border rounded bg-white">
        <input type="number" id="inputPemasukan" placeholder="Pemasukan (Rp)" class="p-2 text-sm border rounded bg-white">
        <input type="number" id="inputPengeluaran" placeholder="Pengeluaran (Rp)" class="p-2 text-sm border rounded bg-white">
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button id="btnBatalEdit" onclick="resetForm()" class="hidden bg-gray-500 text-white px-3 py-2 text-sm rounded font-semibold hover:bg-gray-600">Batal</button>
        <button onclick="simpanData()" class="bg-teal-700 text-white px-4 py-2 text-sm rounded font-semibold hover:bg-teal-800">Simpan ke Google Sheet</button>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto mb-6">
      <table id="tabelLaporan" class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-600 border-b">
          <tr>
            <th class="p-3">Tanggal</th>
            <th class="p-3">Keterangan</th>
            <th class="p-3 text-right">Pemasukan</th>
            <th class="p-3 text-right">Pengeluaran</th>
            <th class="p-3 text-right">Saldo</th>
            <th id="thAksi" class="p-3 text-center hidden">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelBody" class="divide-y">
          <tr><td colspan="5" class="p-4 text-center text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Grafik Per Bulan -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h3 class="font-bold text-gray-700 mb-4 text-sm">Grafik per bulan</h3>
      <div class="h-64">
        <canvas id="kasChart"></canvas>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Data diperbarui secara otomatis dari sistem RW 11 YKB.</p>

  </div>

  <!-- Tombol Melayang Otomatis untuk Instal PWA -->
  <button id="btnInstallApp" onclick="installPWA()" class="hidden fixed bottom-5 right-5 bg-teal-700 text-white font-bold text-xs px-4 py-3 rounded-full shadow-lg border-2 border-white hover:bg-teal-800 z-50 flex items-center gap-2">
    📱 Instal Aplikasi Kas
  </button>

  <script>
    // URL Google Apps Script milik Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbyoB0BXj0bIAbtU5aIPp2fHxizLYbYeLuoC5qLi8O9kkzHzpli5JmfXuk9-_XzO0rz8Cg/exec";
    
    let rawData = [];
    let currentFilteredData = [];
    let isAdmin = false;
    let adminPin = "";
    let myChart = null;

    // Skrip Auto-Update Cache / Versi Aplikasi
    const APP_VERSION = 'v2.5'; // Naikkan versi ini agar cache di HP warga langsung ter-update
    if (localStorage.getItem('app_version') !== APP_VERSION) {
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        });
      }
      localStorage.setItem('app_version', APP_VERSION);
      window.location.reload(true);
    }

    // Variabel & Listener PWA Install Prompt
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstallApp');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstall) btnInstall.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
          if (btnInstall) btnInstall.classList.add('hidden');
        });
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker terdaftar:', reg))
          .catch((err) => console.log('Service Worker gagal:', err));
      });
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        rawData = await res.json();
        
        // 1. Urutkan data otomatis berdasarkan tanggal secara kronologis (Terlama ke Terbaru)
        rawData.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

        // 2. Hitung saldo berjalan (running saldo) dengan akurat
        let runningSaldo = 0;
        rawData.forEach(item => {
          runningSaldo += (Number(item.pemasukan) || 0) - (Number(item.pengeluaran) || 0);
          item.currentSaldo = runningSaldo;
        });

        setupFilterOptions();
        render();
      } catch (e) {
        alert("Gagal memuat data dari Google Sheets.");
      }
    }

    function setupFilterOptions() {
      const filterSelect = document.getElementById("filterBulan");
      const currentSelected = filterSelect.value || "semua";
      filterSelect.innerHTML = '<option value="semua">Semua bulan</option>';
      
      const bulanSet = new Set();
      rawData.forEach(item => {
        if (item.tanggal) {
          const m = item.tanggal.substring(0, 7);
          bulanSet.add(m);
        }
      });

      Array.from(bulanSet).sort().reverse().forEach(b => {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        filterSelect.appendChild(opt);
      });

      filterSelect.value = currentSelected;
    }

    function render() {
      const selectedBulan = document.getElementById("filterBulan").value;
      
      let filtered = rawData.filter(d => {
        if (selectedBulan === "semua") return true;
        return d.tanggal && d.tanggal.startsWith(selectedBulan);
      });

      currentFilteredData = [];
      let saldoAwalBulan = 0;

      if (selectedBulan !== "semua") {
        const dataSebelumnya = rawData.filter(d => d.tanggal && d.tanggal.substring(0, 7) < selectedBulan);
        if (dataSebelumnya.length > 0) {
          saldoAwalBulan = dataSebelumnya[dataSebelumnya.length - 1].currentSaldo;
        }

        if (saldoAwalBulan !== 0 || dataSebelumnya.length > 0) {
          const [thn, bln] = selectedBulan.split('-');
          const dTemp = new Date(thn, bln - 2, 1);
          const namaBulanLalu = dTemp.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

          currentFilteredData.push({
            tanggal: `${thn}-${bln}-01`,
            keterangan: `Sisa saldo bulan ${namaBulanLalu}`,
            pemasukan: saldoAwalBulan,
            pengeluaran: 0,
            isSaldoAwal: true,
            currentSaldo: saldoAwalBulan
          });
        }
      }

      let runningSaldo = saldoAwalBulan;
      filtered.forEach(item => {
        runningSaldo += (Number(item.pemasukan) || 0) - (Number(item.pengeluaran) || 0);
        item.currentSaldo = runningSaldo;
        currentFilteredData.push(item);
      });

      let totalIn = 0, totalOut = 0;
      const tbody = document.getElementById("tabelBody");
      tbody.innerHTML = "";

      currentFilteredData.forEach(item => {
        if (!item.isSaldoAwal) {
          totalIn += Number(item.pemasukan) || 0;
          totalOut += Number(item.pengeluaran) || 0;
        }

        const tr = document.createElement("tr");
        tr.className = item.isSaldoAwal ? "bg-gray-50 italic text-gray-500 font-medium" : "hover:bg-gray-50";
        
        tr.innerHTML = `
          <td class="p-3 text-xs text-gray-600">${formatTanggal(item.tanggal)}</td>
          <td class="p-3 font-medium">${item.keterangan}</td>
          <td class="p-3 text-right text-emerald-600 font-semibold">${item.pemasukan ? 'Rp ' + item.pemasukan.toLocaleString('id-ID') : ''}</td>
          <td class="p-3 text-right text-red-600 font-semibold">${item.pengeluaran ? 'Rp ' + item.pengeluaran.toLocaleString('id-ID') : ''}</td>
          <td class="p-3 text-right font-bold text-gray-700">Rp ${item.currentSaldo.toLocaleString('id-ID')}</td>
          ${isAdmin && !item.isSaldoAwal ? `<td class="p-3 text-center flex justify-center gap-2">
            <button onclick="mulaiEdit(${item.id})" class="text-blue-600 hover:text-blue-800 text-xs font-bold">Edit</button>
            <button onclick="hapusData(${item.id})" class="text-red-500 hover:text-red-700 text-xs font-bold">Hapus</button>
          </td>` : `<td class="p-3 text-center"></td>`}
        `;
        tbody.appendChild(tr);
      });

      let finalSaldo = currentFilteredData.length > 0 ? currentFilteredData[currentFilteredData.length - 1].currentSaldo : 0;

      document.getElementById("totalPemasukan").innerText = "Rp " + totalIn.toLocaleString('id-ID');
      document.getElementById("totalPengeluaran").innerText = "Rp " + totalOut.toLocaleString('id-ID');
      document.getElementById("saldoKas").innerText = "Rp " + finalSaldo.toLocaleString('id-ID');

      renderChart();
    }

    function formatTanggal(tglStr) {
      if (!tglStr) return "";
      const d = new Date(tglStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function toggleAdminMode() {
      if (!isAdmin) {
        const inputPin = prompt("Masukkan PIN Admin:");
        if (inputPin) {
          adminPin = inputPin;
          isAdmin = true;
          document.getElementById("formAdmin").classList.remove("hidden");
          document.getElementById("thAksi").classList.remove("hidden");
          document.getElementById("btnAdmin").innerText = "🔓 Keluar Admin";
          render();
        }
      } else {
        isAdmin = false;
        adminPin = "";
        resetForm();
        document.getElementById("formAdmin").classList.add("hidden");
        document.getElementById("thAksi").classList.add("hidden");
        document.getElementById("btnAdmin").innerText = "🔒 Mode Admin";
        render();
      }
    }

    function mulaiEdit(id) {
      const item = rawData.find(d => d.id == id);
      if (!item) return;

      document.getElementById("editId").value = item.id;
      document.getElementById("inputTanggal").value = item.tanggal;
      document.getElementById("inputKeterangan").value = item.keterangan;
      document.getElementById("inputPemasukan").value = item.pemasukan || "";
      document.getElementById("inputPengeluaran").value = item.pengeluaran || "";

      document.getElementById("formTitle").innerText = "✏️ Edit Transaksi (ID: " + item.id + ")";
      document.getElementById("btnBatalEdit").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("inputTanggal").value = "";
      document.getElementById("inputKeterangan").value = "";
      document.getElementById("inputPemasukan").value = "";
      document.getElementById("inputPengeluaran").value = "";

      document.getElementById("formTitle").innerText = "➕ Tambah Transaksi Baru (Khusus Admin)";
      document.getElementById("btnBatalEdit").classList.add("hidden");
    }

    async function simpanData() {
      const editId = document.getElementById("editId").value;
      const tanggal = document.getElementById("inputTanggal").value;
      const keterangan = document.getElementById("inputKeterangan").value;
      const pemasukan = Number(document.getElementById("inputPemasukan").value) || 0;
      const pengeluaran = Number(document.getElementById("inputPengeluaran").value) || 0;

      if (!tanggal || !keterangan) {
        alert("Tanggal dan Keterangan wajib diisi!");
        return;
      }

      const actionType = editId ? "edit" : "add";
      const payload = { action: actionType, pin: adminPin, id: editId, tanggal, keterangan, pemasukan, pengeluaran };
      
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        
        if (result.status === "success") {
          alert(result.message);
          resetForm();
          loadData();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi.");
      }
    }

    async function hapusData(id) {
      if (!confirm("Yakin ingin menghapus baris ini?")) return;
      const payload = { action: "delete", pin: adminPin, id };
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === "success") {
        loadData();
      } else {
        alert(result.message);
      }
    }

    function renderChart() {
      const monthlyData = {};
      rawData.forEach(d => {
        if (d.tanggal) {
          const m = d.tanggal.substring(0, 7);
          if (!monthlyData[m]) monthlyData[m] = { in: 0, out: 0 };
          monthlyData[m].in += d.pemasukan;
          monthlyData[m].out += d.pengeluaran;
        }
      });

      const labels = Object.keys(monthlyData).sort();
      const dataIn = labels.map(l => monthlyData[l].in);
      const dataOut = labels.map(l => monthlyData[l].out);

      const ctx = document.getElementById('kasChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Pemasukan', data: dataIn, backgroundColor: '#10b981' },
            { label: 'Pengeluaran', data: dataOut, backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function downloadExcel() {
      const selectedBulan = document.getElementById("filterBulan").value;
      const exportData = currentFilteredData.map(item => ({
        "Tanggal": formatTanggal(item.tanggal),
        "Keterangan": item.keterangan,
        "Pemasukan (Rp)": item.pemasukan || 0,
        "Pengeluaran (Rp)": item.pengeluaran || 0,
        "Saldo (Rp)": item.currentSaldo || 0
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Kas");

      const fileName = `Laporan_Kas_RW11_YKB_${selectedBulan}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }

    const NAMA_KETUA_RW   = "Meky Kurniawan, S.Pd.";
    const NAMA_SEKRETARIS = "Bobby Ramadhana";
    const NAMA_BENDAHARA  = "Dolly Andika";

    // Fungsi bantu ubah gambar logo ke Base64 untuk PDF
    function getBase64ImageFromUrl(imageUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataURL = canvas.toDataURL('image/png');
          resolve(dataURL);
        };
        img.onerror = error => reject(error);
        img.src = imageUrl;
      });
    }

    // --- FUNGSI DOWNLOAD PDF DENGAN LOGO DI KIRI ATAS ---
    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const selectedBulan = document.getElementById("filterBulan").value;

      function getTglAkhirBulanFormatted(selectedBulan) {
        const namaBulanIndo = [
          "Januari", "Februari", "Maret", "April", "Mei", "Juni",
          "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        let tglObj;
        if (selectedBulan && selectedBulan !== "semua") {
          const parts = selectedBulan.split("-");
          const year = parseInt(parts[0], 10);
          const month = parseInt(parts[1], 10);
          tglObj = new Date(year, month, 0); 
        } else {
          tglObj = new Date();
        }

        const tgl = tglObj.getDate();
        const bln = namaBulanIndo[tglObj.getMonth()];
        const thn = tglObj.getFullYear();

        return `Batam, ${tgl} ${bln} ${thn}`;
      }

      // Coba masukkan logo ke PDF
      let startYTable = 26;
      try {
        const logoDataUrl = await getBase64ImageFromUrl('logo.png');
        // doc.addImage(imageData, format, x, y, width, height)
        doc.addImage(logoDataUrl, 'PNG', 14, 10, 14, 14);
        
        // Jika ada logo, geser teks judul ke kanan dikit agar sejajar rapi
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("LAPORAN KAS RW 11 YKB", 32, 15);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`Periode: ${selectedBulan === "semua" ? "Semua Bulan" : selectedBulan}`, 32, 21);
        startYTable = 28;
      } catch (e) {
        // Fallback jika logo gagal dimuat
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("LAPORAN KAS RW 11 YKB", 14, 15);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`Periode: ${selectedBulan === "semua" ? "Semua Bulan" : selectedBulan}`, 14, 22);
        startYTable = 26;
      }

      const tableRows = currentFilteredData.map(item => [
        formatTanggal(item.tanggal),
        item.keterangan,
        item.pemasukan ? 'Rp ' + item.pemasukan.toLocaleString('id-ID') : '-',
        item.pengeluaran ? 'Rp ' + item.pengeluaran.toLocaleString('id-ID') : '-',
        'Rp ' + (item.currentSaldo || 0).toLocaleString('id-ID')
      ]);

      doc.autoTable({
        startY: startYTable,
        head: [['Tanggal', 'Keterangan', 'Pemasukan', 'Pengeluaran', 'Saldo']],
        body: tableRows,
        theme: 'grid',
        headStyles: { fillColor: [0, 92, 83] },
        styles: { fontSize: 8 }
      });

      let finalY = doc.lastAutoTable.finalY + 12;
      if (finalY + 45 > doc.internal.pageSize.getHeight()) {
        doc.addPage();
        finalY = 20;
      }

      const teksTanggal = getTglAkhirBulanFormatted(selectedBulan);

      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      doc.text(teksTanggal, 145, finalY);
      doc.text("Sekretaris RW 11", 20, finalY + 6);
      doc.text("Bendahara RW 11", 145, finalY + 6);

      doc.text("Mengetahui,", 85, finalY + 12);
      doc.text("Ketua RW 11 YKB", 82, finalY + 18);

      doc.setFont("helvetica", "bold");
      doc.text(`( ${NAMA_SEKRETARIS} )`, 15, finalY + 38);
      doc.text(`( ${NAMA_BENDAHARA} )`, 140, finalY + 38);
      doc.text(`( ${NAMA_KETUA_RW} )`, 78, finalY + 42);

      const fileName = `Laporan_Kas_RW11_YKB_${selectedBulan}.pdf`;
      doc.save(fileName);
    }

    loadData();
  </script>
</body>
</html>
